[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turtlebot-nav-lab"
version = "0.2.0"
description = "Finite simulation SAC training and navigation evaluation"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3"]

[project.scripts]
turtlebot-nav = "turtlebot_nav.cli:main"

[tool.setuptools.packages.find]
where = ["src/turtlebot3_smart_nav/src"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
